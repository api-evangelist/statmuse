aid: statmuse
name: StatMuse
description: StatMuse is a natural-language search engine that answers sports and financial
  questions in plain English, returning instant stats, tables, and visual answers.
  It covers MLB, NBA, NFL, NHL, WNBA, PGA, college football, and soccer, along with
  StatMuse Money for stock-market and finance data. Users ask questions conversationally
  ("How many points did LeBron score last night?") and get sourced answers with charts
  and shareable cards. Backed by Techstars, the company is consumer-facing and does
  not currently publish a public developer API, SDKs, or programmatic access surface;
  this profile is maintained in the API Evangelist network as a company lead.
